<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171923">
  <title>ACG 卡牌构筑器</title>
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#171923; color:#f5f5f5; font-family:Arial,"Microsoft YaHei",sans-serif; }
    header { padding:18px 24px; background:#222536; border-bottom:1px solid #383d50; }
    header h1 { margin:0; font-size:22px; }
    main { max-width:1250px; margin:0 auto; padding:24px; }
    .intro { margin:8px 0 20px; color:#a6abc0; line-height:1.6; }
    .tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    button, input, select { font:inherit; }
    button { border:1px solid #4a526d; border-radius:9px; padding:10px 14px; color:#f5f5f5; background:#30364b; cursor:pointer; }
    button.active, button.primary { background:#5967a5; border-color:#7181c7; }
    button:disabled { opacity:.4; cursor:not-allowed; }
    input, select { width:100%; padding:11px 12px; border:1px solid #41475d; border-radius:9px; background:#222536; color:#f5f5f5; font-size:14px; }
    .toolbar { display:grid; grid-template-columns:minmax(180px,1fr) 150px 150px; gap:10px; margin-bottom:18px; }
    .summary { margin:0 0 14px; color:#a6abc0; font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px; }
    .card { overflow:hidden; background:#222536; border:1px solid #383d50; border-radius:12px; }
    .card img { display:block; width:100%; aspect-ratio:5/7; object-fit:contain; background:#11131b; }
    .card-info { padding:12px; }
    .card-title { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
    .card-title h3 { margin:0; font-size:16px; line-height:1.45; }
    .star { flex:0 0 auto; color:#f3cc72; font-size:13px; white-space:nowrap; }
    .type { color:#a6abc0; font-size:12px; margin-bottom:9px; }
    .effect { color:#e0e2eb; font-size:13px; line-height:1.65; white-space:pre-wrap; }
    .empty,.loading,.error,.panel { padding:22px 16px; background:#222536; border:1px solid #383d50; border-radius:12px; }
    .empty,.loading { text-align:center; color:#a6abc0; }
    .error { color:#ff9b9b; }
    .panel { margin-bottom:18px; }
    .panel h3 { margin:0 0 10px; font-size:16px; }
    .hint { color:#a6abc0; font-size:13px; line-height:1.65; margin:8px 0 0; }
    .admin-top { display:grid; grid-template-columns:1fr 1fr; gap:12px; align-items:end; }
    .field label { display:block; color:#c5c9d8; font-size:13px; margin-bottom:7px; }
    .field button { margin-top:8px; }
    .admin-card { display:flex; gap:12px; align-items:center; padding:10px; background:#222536; border:1px solid #383d50; border-radius:12px; min-width:0; }
    .admin-card img { width:66px; aspect-ratio:5/7; object-fit:contain; background:#11131b; border-radius:6px; flex:0 0 auto; }
    .admin-card-main { flex:1; min-width:0; }
    .admin-card-main strong { display:block; margin-bottom:5px; overflow-wrap:anywhere; }
    .admin-card-main small { color:#a6abc0; line-height:1.5; }
    .counter { display:flex; align-items:center; gap:9px; flex:0 0 auto; }
    .counter button { width:36px; height:36px; padding:0; font-size:20px; }
    .count { min-width:22px; text-align:center; font-weight:bold; font-variant-numeric:tabular-nums; }
    .save-row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:16px; }
    .status { color:#a6abc0; font-size:13px; }
    .status.good { color:#8bd5a7; } .status.bad { color:#ff9b9b; }
    .hidden { display:none !important; }
    @media(max-width:700px) {
      main { padding:16px; } .toolbar { grid-template-columns:1fr 1fr; }
      .toolbar input { grid-column:1/-1; } .grid { grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
      .card-info { padding:9px; } .card-title h3 { font-size:14px; } .effect { font-size:12px; }
      .admin-top { grid-template-columns:1fr; } .admin-card { gap:8px; padding:8px; }
      .admin-card img { width:54px; } .counter { gap:5px; } .counter button { width:32px; height:32px; }
    }
  </style>
</head>
<body>
  <header><h1>ACG 卡牌构筑器</h1></header>
  <main>
    <h2 id="page-title">概念礼装图鉴</h2>
    <p class="intro">浏览卡包中的卡牌，或进入管理员模式管理玩家收藏。</p>
    <nav class="tabs">
      <button id="tab-library" class="active" type="button">卡牌图鉴</button>
      <button id="tab-admin" type="button">管理员收藏管理</button>
    </nav>

    <section id="library-view">
      <section class="toolbar" aria-label="卡牌筛选">
        <input id="search" type="search" placeholder="搜索卡牌名称或效果……">
        <select id="star-filter"><option value="">全部星级</option><option value="3">3星</option><option value="4">4星</option><option value="5">5星</option></select>
        <select id="type-filter"><option value="">全部类型</option></select>
      </section>
      <p class="summary" id="summary">正在读取卡牌资料……</p>
      <section class="grid" id="card-list"><div class="loading">正在加载卡牌……</div></section>
    </section>

    <section id="admin-view" class="hidden">
      <div class="panel">
        <h3>GitHub 管理员授权</h3>
        <p class="hint">需要一个仅对本仓库有权限的 Fine-grained personal access token。建议只授权仓库 <strong>ren-scarlet/ACG-</strong>，并仅开启 Contents：Read and write。密钥只保存在当前页面内存中，刷新或关闭页面后需要重新输入，不会写入网页文件或浏览器长期存储。</p>
        <div class="admin-top" style="margin-top:14px">
          <div class="field">
            <label for="github-token">GitHub 访问密钥</label>
            <input id="github-token" type="password" autocomplete="off" placeholder="粘贴 Fine-grained token">
          </div>
          <div class="field">
            <label>授权操作</label>
            <button id="verify-token" class="primary" type="button">验证授权并读取收藏</button>
            <p class="hint"><a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener noreferrer" style="color:#aebcff">前往 GitHub 创建访问密钥</a></p>
          </div>
        </div>
        <p id="auth-status" class="status">尚未授权。</p>
      </div>

      <div id="admin-workspace" class="hidden">
        <div class="panel">
          <div class="admin-top">
            <div class="field">
              <label for="player-select">选择要管理的玩家</label>
              <select id="player-select"></select>
            </div>
            <div class="field">
              <label for="admin-search">搜索卡牌</label>
              <input id="admin-search" type="search" placeholder="输入卡牌名称……">
            </div>
          </div>
          <p class="hint">点击加减只会暂存修改；点击「保存收藏」后才会写入 GitHub。</p>
          <div class="save-row">
            <button id="save-collections" class="primary" type="button">保存收藏</button>
            <button id="discard-changes" type="button">放弃未保存修改</button>
            <span id="save-status" class="status">尚无未保存修改。</span>
          </div>
        </div>
        <p id="admin-summary" class="summary"></p>
        <section id="admin-card-list" class="grid"></section>
      </div>
    </section>
  </main>

  <script>
    const OWNER = "ren-scarlet";
    const REPO = "ACG-";
    const COLLECTION_PATH = "data/collections.json";
    const cardList = document.getElementById("card-list");
    const searchInput = document.getElementById("search");
    const starFilter = document.getElementById("star-filter");
    const typeFilter = document.getElementById("type-filter");
    const summary = document.getElementById("summary");
    const packName = document.getElementById("page-title");
    const adminCardList = document.getElementById("admin-card-list");
    const playerSelect = document.getElementById("player-select");
    const adminSearch = document.getElementById("admin-search");
    const authStatus = document.getElementById("auth-status");
    const saveStatus = document.getElementById("save-status");
    let allCards = [], allPlayers = [], collections = [];
    let draftCollections = [];
    let githubToken = "";
    let authorized = false;

    const apiHeaders = () => ({
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28",
      "Authorization": "Bearer " + githubToken
    });
    function setStatus(el, message, kind="") {
      el.textContent = message;
      el.className = "status" + (kind ? " " + kind : "");
    }
    function cloneData(data) { return JSON.parse(JSON.stringify(data)); }
    function getCount(data, playerId, cardId) {
      const row = data.find(x => x.player_id === playerId && x.card_id === cardId);
      return row ? Number(row.quantity) || 0 : 0;
    }
    function setCount(data, playerId, cardId, quantity) {
      const index = data.findIndex(x => x.player_id === playerId && x.card_id === cardId);
      if (quantity <= 0) {
        if (index >= 0) data.splice(index, 1);
      } else if (index >= 0) {
        data[index].quantity = quantity;
      } else {
        data.push({ player_id: playerId, card_id: cardId, quantity });
      }
    }
    function isDirty() { return JSON.stringify(draftCollections) !== JSON.stringify(collections); }

    function renderCards() {
      const keyword = searchInput.value.trim().toLowerCase();
      const star = starFilter.value, type = typeFilter.value;
      const filtered = allCards.filter(card =>
        (!keyword || card.name.toLowerCase().includes(keyword) || card.effect.toLowerCase().includes(keyword)) &&
        (!star || String(card.star) === star) && (!type || card.type === type)
      );
      summary.textContent = `显示 ${filtered.length} / ${allCards.length} 张卡牌`;
      cardList.replaceChildren();
      if (!filtered.length) { cardList.innerHTML = '<div class="empty">没有找到符合条件的卡牌。</div>'; return; }
      filtered.forEach(card => {
        const article = document.createElement("article"); article.className = "card";
        const img = document.createElement("img"); img.src = card.image; img.alt = card.name; img.loading = "lazy";
        const info = document.createElement("div"); info.className = "card-info";
        const title = document.createElement("div"); title.className = "card-title";
        const name = document.createElement("h3"); name.textContent = card.name;
        const starLabel = document.createElement("span"); starLabel.className = "star"; starLabel.textContent = card.star + "星";
        title.append(name, starLabel);
        const typeLabel = document.createElement("div"); typeLabel.className = "type";
        typeLabel.textContent = card.type + (card.tags && card.tags.length ? " · " + card.tags.join(" · ") : "");
        const effect = document.createElement("div"); effect.className = "effect"; effect.textContent = card.effect;
        info.append(title, typeLabel, effect); article.append(img, info); cardList.appendChild(article);
      });
    }

    function renderAdminCards() {
      const playerId = playerSelect.value;
      const keyword = adminSearch.value.trim().toLowerCase();
      const filtered = allCards.filter(card => !keyword || card.name.toLowerCase().includes(keyword));
      adminCardList.replaceChildren();
      const total = allCards.reduce((sum, card) => sum + getCount(draftCollections, playerId, card.id), 0);
      document.getElementById("admin-summary").textContent = `${playerSelect.selectedOptions[0]?.textContent || ""} · ${filtered.length} 张卡牌 · 收藏总数 ${total}`;
      filtered.forEach(card => {
        const row = document.createElement("article"); row.className = "admin-card";
        const img = document.createElement("img"); img.src = card.image; img.alt = card.name; img.loading = "lazy";
        const info = document.createElement("div"); info.className = "admin-card-main";
        const name = document.createElement("strong"); name.textContent = card.name;
        const meta = document.createElement("small"); meta.textContent = card.star + "星 · " + card.type + (card.type === "对战道具" ? " · 消耗品" : "");
        info.append(name, meta);
        const counter = document.createElement("div"); counter.className = "counter";
        const minus = document.createElement("button"); minus.type = "button"; minus.textContent = "−"; minus.setAttribute("aria-label", "减少" + card.name);
        const count = document.createElement("span"); count.className = "count"; count.textContent = getCount(draftCollections, playerId, card.id);
        const plus = document.createElement("button"); plus.type = "button"; plus.textContent = "+"; plus.setAttribute("aria-label", "增加" + card.name);
        minus.disabled = Number(count.textContent) <= 0;
        minus.addEventListener("click", () => { setCount(draftCollections, playerId, card.id, getCount(draftCollections, playerId, card.id)-1); renderAdminCards(); updateDirtyStatus(); });
        plus.addEventListener("click", () => { setCount(draftCollections, playerId, card.id, getCount(draftCollections, playerId, card.id)+1); renderAdminCards(); updateDirtyStatus(); });
        counter.append(minus, count, plus); row.append(img, info, counter); adminCardList.appendChild(row);
      });
    }
    function updateDirtyStatus() {
      setStatus(saveStatus, isDirty() ? "有未保存的修改。" : "尚无未保存修改。", isDirty() ? "bad" : "");
    }
    async function githubGetCollections() {
      const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${COLLECTION_PATH}`;
      const response = await fetch(url, { headers: apiHeaders(), cache: "no-store" });
      const body = await response.json();
      if (!response.ok) throw new Error(body.message || "读取 GitHub 文件失败（HTTP " + response.status + "）");
      const decoded = new TextDecoder().decode(Uint8Array.from(atob(body.content.replace(/\n/g, "")), c => c.charCodeAt(0)));
      return { sha: body.sha, data: JSON.parse(decoded) };
    }
    async function verifyToken() {
      const tokenInput = document.getElementById("github-token").value.trim();
      if (!tokenInput) { setStatus(authStatus, "请先粘贴 GitHub 访问密钥。", "bad"); return; }
      githubToken = tokenInput;
      setStatus(authStatus, "正在验证权限并读取收藏……");
      try {
        const result = await githubGetCollections();
        if (!Array.isArray(result.data)) throw new Error("collections.json 格式不正确，当前版本要求使用数组格式。");
        collections = result.data; draftCollections = cloneData(collections); authorized = true;
        document.getElementById("admin-workspace").classList.remove("hidden");
        setStatus(authStatus, "授权成功，已读取最新收藏数据。", "good");
        renderAdminCards(); updateDirtyStatus();
      } catch (error) {
        githubToken = ""; authorized = false;
        setStatus(authStatus, "授权失败：" + error.message + "。请确认密钥权限包含 Contents：Read and write。", "bad");
      }
    }
    async function saveCollections() {
      if (!authorized || !githubToken) { setStatus(saveStatus, "请先完成 GitHub 授权。", "bad"); return; }
      if (!isDirty()) { setStatus(saveStatus, "没有需要保存的修改。"); return; }
      const saveButton = document.getElementById("save-collections");
      saveButton.disabled = true; setStatus(saveStatus, "正在保存到 GitHub……");
      try {
        const latest = await githubGetCollections();
        const bytes = new TextEncoder().encode(JSON.stringify(draftCollections, null, 2) + "\n");
        let binary = ""; for (let i=0;i<bytes.length;i++) binary += String.fromCharCode(bytes[i]);
        const encoded = btoa(binary);
        const response = await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${COLLECTION_PATH}`, {
          method: "PUT", headers: { ...apiHeaders(), "Content-Type": "application/json" },
          body: JSON.stringify({ message: "Update player card collections", content: encoded, sha: latest.sha })
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.message || "GitHub 保存失败（HTTP " + response.status + "）");
        collections = cloneData(draftCollections);
        setStatus(saveStatus, "保存成功！其他玩家刷新网页后即可看到最新收藏。", "good");
      } catch (error) {
        setStatus(saveStatus, "保存失败：" + error.message + "。未确认保存成功，请勿重复扣除道具。", "bad");
      } finally { saveButton.disabled = false; renderAdminCards(); }
    }

    document.getElementById("tab-library").addEventListener("click", () => {
      document.getElementById("library-view").classList.remove("hidden");
      document.getElementById("admin-view").classList.add("hidden");
      document.getElementById("tab-library").classList.add("active");
      document.getElementById("tab-admin").classList.remove("active");
      packName.textContent = "概念礼装图鉴";
    });
    document.getElementById("tab-admin").addEventListener("click", () => {
      document.getElementById("library-view").classList.add("hidden");
      document.getElementById("admin-view").classList.remove("hidden");
      document.getElementById("tab-admin").classList.add("active");
      document.getElementById("tab-library").classList.remove("active");
      packName.textContent = "管理员收藏管理";
    });
    document.getElementById("verify-token").addEventListener("click", verifyToken);
    document.getElementById("save-collections").addEventListener("click", saveCollections);
    document.getElementById("discard-changes").addEventListener("click", () => {
      draftCollections = cloneData(collections); renderAdminCards(); updateDirtyStatus();
    });
    playerSelect.addEventListener("change", renderAdminCards);
    adminSearch.addEventListener("input", renderAdminCards);
    searchInput.addEventListener("input", renderCards);
    starFilter.addEventListener("change", renderCards);
    typeFilter.addEventListener("change", renderCards);

    async function loadData() {
      try {
        const [cardsResponse, packsResponse, playersResponse] = await Promise.all([
          fetch("./data/cards.json"), fetch("./data/packs.json"), fetch("./data/players.json")
        ]);
        if (!cardsResponse.ok || !packsResponse.ok || !playersResponse.ok) throw new Error("无法读取数据文件");
        allCards = await cardsResponse.json();
        const packs = await packsResponse.json();
        allPlayers = await playersResponse.json();
        const firstPack = packs.find(pack => pack.id === "pack_001");
        if (firstPack) packName.textContent = firstPack.name + " · 概念礼装图鉴";
        [...new Set(allCards.map(card => card.type))].sort().forEach(type => {
          const option = document.createElement("option"); option.value = type; option.textContent = type; typeFilter.appendChild(option);
        });
        allPlayers.forEach(player => {
          const option = document.createElement("option"); option.value = player.id; option.textContent = player.id + " · " + player.name; playerSelect.appendChild(option);
        });
        renderCards();
      } catch (error) {
        summary.textContent = "卡牌资料读取失败";
        cardList.innerHTML = '<div class="error">读取失败。请稍后刷新网页，或检查 data 文件是否存在。</div>';
      }
    }
    loadData();
  </script>
</body>
</html>

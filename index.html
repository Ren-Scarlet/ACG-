<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171923">
  <title>ACG 卡牌构筑器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #171923;
      color: #f5f5f5;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }
    header {
      padding: 22px;
      background: #222536;
      border-bottom: 1px solid #383d50;
    }
    header h1 { margin: 0; font-size: 22px; }
    main {
      max-width: 850px;
      margin: 70px auto;
      padding: 24px;
      text-align: center;
    }
    .panel {
      padding: 35px 20px;
      background: #222536;
      border: 1px solid #383d50;
      border-radius: 14px;
    }
    .panel h2 { margin-top: 0; }
    .muted { color: #a6abc0; line-height: 1.8; }
    .status {
      display: inline-block;
      padding: 7px 13px;
      border-radius: 20px;
      background: #174b39;
      color: #7de0ae;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <h1>ACG 卡牌构筑器</h1>
  </header>

  <main>
    <div class="panel">
      <span class="status">网页已建立</span>
      <h2>欢迎来到卡牌构筑器</h2>
      <p class="muted">
        这里将成为你的 ACG 桌游卡牌数据库与构筑平台。
      </p>
      <p class="muted">
        卡牌资料库、卡包浏览、玩家收藏、卡组构筑与 TTS 导入功能正在搭建中。
      </p>
    </div>
  </main>
</body>
</html>

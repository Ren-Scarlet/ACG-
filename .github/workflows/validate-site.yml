name: Validate ACG site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check auth.js
          node --check player-center.js
          node --check item-mail.js
          node --check fishing.js
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess, tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script":
                      attrs = dict(attrs)
                      self.in_script = True
                      self.external = "src" in attrs
                      self.parts = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      if not self.external:
                          source = "".join(self.parts).strip()
                          if source:
                              self.scripts.append(source)
                      self.in_script = False
                      self.external = False

          parser = Scripts()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          for i, source in enumerate(parser.scripts):
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as f:
                  f.write(source)
                  f.flush()
                  subprocess.run(["node", "--check", f.name], check=True)
          print(f"Checked {len(parser.scripts)} inline scripts.")
          PY
      - name: Validate JSON and card image references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ["data/cards.json", "data/packs.json", "data/deck_rules.json"]:
              json.loads(Path(name).read_text(encoding="utf-8"))

          cards = json.loads(Path("data/cards.json").read_text(encoding="utf-8"))
          packs = json.loads(Path("data/packs.json").read_text(encoding="utf-8"))
          ids = [card["id"] for card in cards]
          assert len(ids) == len(set(ids)), "Duplicate card IDs found"
          pack_ids = {pack["id"] for pack in packs}
          for card in cards:
              assert card.get("pack_id") in pack_ids, f"Unknown pack for {card['id']}"
              image = card.get("image", "").removeprefix("./")
              assert image and Path(image).is_file(), f"Missing image for {card['id']}: {image}"
          print(f"Validated {len(cards)} cards, {len(packs)} packs and all card images.")
          PY
      - name: Check key migration coverage
        run: |
          python - <<'PY'
          from pathlib import Path
          draw = Path("supabase/card-draw-v2.sql").read_text(encoding="utf-8")
          cover = Path("supabase/card-draw-cover.sql").read_text(encoding="utf-8")
          preflight = Path("supabase/launch-preflight.sql").read_text(encoding="utf-8")
          for name in ["draw_packages", "dismantle_cards", "admin_set_draw_pool_v2"]:
              assert f"function public.{name}" in draw, f"Missing draw function: {name}"
          assert "cover_card_id" in cover and "admin_set_draw_pool_cover" in cover
          for name in ["draw_packages", "dismantle_cards", "admin_set_draw_pool_v2", "admin_set_draw_pool_cover"]:
              assert f"'{name}'" in preflight, f"Preflight missing function: {name}"
          assert "card_dismantle_requests" in preflight
          items = Path("supabase/item-workshop-mail-v1.sql").read_text(encoding="utf-8")
          for name in ["admin_save_item", "use_inventory_item", "admin_send_mail", "player_claim_mail"]:
              assert f"function public.{name}" in items, f"Missing item/mail function: {name}"
          for name in ["item_catalog", "mail_messages", "mail_recipients", "mail_attachments"]:
              assert f"'{name}'" in preflight, f"Preflight missing table: {name}"
          for name in ["admin_save_item", "use_inventory_item", "admin_send_mail", "player_claim_mail"]:
              assert f"'{name}'" in preflight, f"Preflight missing function: {name}"
          seasons = Path("supabase/monthly-seasons-v1.sql").read_text(encoding="utf-8")
          for name in ["match_seasons", "season_player_stats", "season_rank_rewards", "season_player_settlements"]:
              assert f"public.{name}" in seasons, f"Missing season table: {name}"
          for name in ["sync_season_match_result", "admin_save_season_rank_reward", "admin_settle_monthly_season", "run_monthly_season_rollover", "player_list_my_seasons", "admin_resend_season_reward"]:
              assert f"function public.{name}" in seasons, f"Missing season function: {name}"
          import re
          fishing_base = Path("supabase/fishing-system-v1.sql").read_text(encoding="utf-8")
          fishing_v2 = Path("supabase/fishing-overhaul-v2.sql").read_text(encoding="utf-8")
          fishing_engine = Path("supabase/fishing-overhaul-v2-engine.sql").read_text(encoding="utf-8")
          fishing_install = Path("supabase/fishing-overhaul-v2-install.sql").read_text(encoding="utf-8")
          fishing_js = Path("fishing.js").read_text(encoding="utf-8")
          rules_block = fishing_v2.split("insert into public.fishing_fish_rules_v2", 1)[1].split("on conflict (fish_id)", 1)[0]
          fish_pairs = re.findall(r"\('([a-z0-9_]+)'\s*,\s*'(small_mixed_bait|medium_mixed_bait|large_mixed_bait|unknown_mixed_bait)'", fishing_base + fishing_v2)
          fish_ids = {fish_id for fish_id, _bait_id in fish_pairs}
          rule_ids = set(re.findall(r"\('([a-z0-9_]+)'\s*,\s*'(?:qinglan_lake|reed_marsh|deepwater_bay)'", rules_block))
          assert len(fish_ids) == 36, f"Expected 36 fish entries, found {len(fish_ids)}"
          assert fish_ids <= rule_ids, f"Fish missing encounter rules: {sorted(fish_ids - rule_ids)}"
          original_seed = fishing_v2.split("-- Ensure all ten original species exist", 1)[1].split("on conflict (fish_id)", 1)[0]
          original_seed_ids = set(re.findall(r"\('([a-z0-9_]+)'\s*,\s*'(?:small_mixed_bait|medium_mixed_bait|large_mixed_bait|unknown_mixed_bait)'", original_seed))
          assert len(original_seed_ids) == 10, f"V2 must restore all ten original fish, found {len(original_seed_ids)}"
          assert "v2_available boolean" in fishing_v2, "V2 fish visibility must be isolated from legacy is_active"
          assert "v2_available=true" in fishing_v2 and "f.v2_available" in fishing_engine
          assert '.eq("v2_available",true)' in fishing_js, "V2 frontend must read the isolated V2 catalogue"
          for fallback in ["jade_scale_carp", "reed_whisker", "deepwater_catfish", "sunset_gar", "cobalt_tuna", "bluegill", "whitewater_salmon"]:
              assert fallback in fishing_v2, f"Missing all-weather bait fallback: {fallback}"
          for prerequisite in ["fishing_craft_history", "player_fishing_achievements", "fishing_points_ledger", "item_catalog"]:
              assert prerequisite in fishing_engine, f"Engine prerequisite guard missing: {prerequisite}"
          def without_transaction(source):
              start = source.index("begin;") + len("begin;")
              end = source.rindex("commit;")
              return source[start:end].strip()
          expected_install = (
              "-- ACG Fishing V2 combined installer.\n"
              "-- Run once after the existing Fishing V1 and item-workshop migrations.\n"
              "-- Both additive migrations execute in ONE transaction: any error rolls back the entire V2 install.\n\n"
              "begin;\n\n" + without_transaction(fishing_v2) +
              "\n\n-- V2 server engine and special-bait rewards.\n\n" +
              without_transaction(fishing_engine) + "\n\ncommit;\n"
          )
          assert fishing_install == expected_install, "Combined installer is stale; regenerate it from the two canonical migrations."
          for name in ["fishing_locations_v2", "fishing_weather_slots_v2", "fishing_fish_rules_v2", "rainbow_phantom", "fog_veil_koi", "thunder_crown_eel", "old_lake_dragon"]:
              assert name in fishing_v2, f"Fishing V2 migration missing: {name}"
          for name in ["fishing_start_cast_v2", "fishing_hook_cast_v2", "fishing_finish_reel_v2", "fishing_get_records_v2", "fishing_craft_special_bait", "fishing_admin_grant_special_bait"]:
              assert f"function public.{name}" in fishing_engine, f"Fishing V2 engine missing: {name}"
          fishing_activate = Path("supabase/fishing-overhaul-v2-activate.sql").read_text(encoding="utf-8")
          assert "fishing_start_cast(text,uuid)" in fishing_activate, "Final activation must disable the legacy cast entry point"
          fishing_verify = Path("supabase/fishing-overhaul-v2-verify.sql").read_text(encoding="utf-8")
          fishing_preflight = Path("supabase/fishing-overhaul-v2-preflight.sql").read_text(encoding="utf-8")
          fishing_activate_verify = Path("supabase/fishing-overhaul-v2-activate-verify.sql").read_text(encoding="utf-8")
          assert "player_fishing_stats" in fishing_preflight and "card_inventory" in fishing_preflight
          assert "player_fishing_stats" in fishing_verify and "player_fishbook" in fishing_verify
          assert "record_reward_size_cm" in fishing_engine and "fishing_get_records_v2" in fishing_engine
          assert "pool_ready" in fishing_verify, "Verification must check ordinary bait availability at every location"
          assert "legacy_cast_still_executable" in fishing_activate_verify and "v2_cast_executable" in fishing_activate_verify
          assert "set is_active=true where v2_available=true" in fishing_activate, "Activation must expose the full V2 catalogue only when disabling legacy casting"
          print("Key draw, item workshop, mailbox, reward, monthly season and fishing V2 functions are represented in source.")
          PY

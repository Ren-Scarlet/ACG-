<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACG 卡包实验室 · MD 十连开包演出</title>
<style>
:root{color-scheme:dark;--gold:#f3d36f;--blue:#5bc8ed;--muted:#9ba9bd}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#edf4ff;font-family:Inter,"Microsoft YaHei",sans-serif;background:radial-gradient(ellipse at 50% -15%,#4a5362 0,#202638 32%,#0b101b 72%,#070a11 100%);overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(175deg,transparent 0 80px,#d3e4ff08 82px,#fff0 84px 155px);opacity:.6}
button{font:inherit;cursor:pointer;color:inherit}.top{height:60px;padding:0 max(18px,calc((100vw - 1160px)/2));display:flex;align-items:center;justify-content:space-between;background:#070b13d9;border-bottom:1px solid #ffffff1c;position:relative;z-index:2}.brand{font-weight:1000;letter-spacing:3px}.brand b{color:var(--gold)}.tag{font-size:10px;letter-spacing:1.5px;border:1px solid #8e7948;color:#f4d98c;padding:7px 10px}
main{max-width:1160px;margin:auto;padding:30px 20px 65px}.eyebrow{text-align:center;color:#8dddf5;font-size:10px;letter-spacing:5px;font-weight:800}.hero{text-align:center;margin:7px 0 22px}.hero h1{font-size:clamp(27px,4vw,40px);letter-spacing:3px;margin:8px 0}.hero p{font-size:12px;color:var(--muted);margin:0}
.selector{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:22px 0}.selector button{border:1px solid #45556c;background:#111b2b;padding:9px 17px;font-size:12px;color:#c5d0df;transition:.2s}.selector button.active,.selector button:hover{border-color:var(--gold);color:#ffe6a0;box-shadow:0 0 15px #e6c35a2b}
.stage{position:relative;max-width:1000px;margin:0 auto;padding:23px 20px 20px;min-height:480px;border:1px solid #56637a;background:radial-gradient(ellipse at 50% 42%,#414b5d 0,#222b3d 40%,#111827 78%);box-shadow:0 20px 55px #0009,inset 0 0 55px #0008;overflow:hidden}
.stage:before{content:"";position:absolute;inset:8px;border:1px solid #c2a65b55;pointer-events:none}.stage:after{content:"";position:absolute;left:-10%;right:-10%;top:44%;height:2px;background:linear-gradient(90deg,transparent,#6fdcff88,#fff,#d4a9ff88,transparent);filter:blur(2px);opacity:.75}
.stage-head{position:relative;z-index:1;text-align:center}.stage-head h2{font-size:15px;letter-spacing:4px;margin:0 0 6px;color:#f5d77f}.stage-head p{margin:0;font-size:10px;color:#aab8ca;letter-spacing:1px}
.packs{position:relative;z-index:1;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px 16px;max-width:790px;margin:24px auto 0;perspective:900px}
.booster{position:relative;min-width:0;aspect-ratio: .69;max-height:230px;border:2px solid #d8bd69;background:linear-gradient(145deg,#293b56,#101b2d 55%,#060b14);box-shadow:0 9px 18px #0009,inset 0 0 22px #7aa4d333;cursor:pointer;transition:transform .35s,filter .35s,opacity .35s;overflow:hidden;animation:packIn .65s both;animation-delay:calc(var(--i)*65ms)}
@keyframes packIn{from{opacity:0;transform:translateY(45px) rotateX(22deg) scale(.8)}to{opacity:1;transform:none}}
.booster:nth-child(6),.booster:nth-child(7),.booster:nth-child(8),.booster:nth-child(9),.booster:nth-child(10){transform:translateY(18px)}
.booster:before{content:"";position:absolute;inset:6px;border:1px solid #e8d28b77;z-index:1;pointer-events:none}.booster:after{content:"ACG";position:absolute;left:0;right:0;top:43%;font-size:clamp(17px,2.4vw,27px);font-weight:1000;letter-spacing:4px;text-align:center;color:#f2d989;text-shadow:0 2px 8px #000,0 0 16px #e7be5b;z-index:2}
.booster .art{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 43%,#e2c66b55,transparent 55%),linear-gradient(140deg,#334f71,#17243a 58%,#080d17)}
.booster .art:before,.booster .art:after{content:"";position:absolute;width:70%;aspect-ratio:1;left:15%;top:17%;border:1px solid #e7cf8b88;transform:rotate(45deg);box-shadow:0 0 25px #d9b85d55}.booster .art:after{transform:rotate(22.5deg);border-color:#a9dfff88;width:55%;left:22.5%;top:24%}
.booster .pack-name{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:9px;letter-spacing:2px;color:#e5edf8;text-shadow:0 2px 4px #000;z-index:2}
.booster.r4{border-color:#9bc5ff;box-shadow:0 0 13px #7ab8ff88,0 9px 18px #0009}.booster.r4 .art{background:radial-gradient(ellipse at 50% 43%,#7cbaff99,transparent 57%),linear-gradient(140deg,#263e68,#101c36 58%,#080d17)}
.booster.r5{border-color:#ffdc69;box-shadow:0 0 22px #ffdb65dd,0 0 5px #fff,0 9px 18px #0009}.booster.r5 .art{background:radial-gradient(ellipse at 50% 43%,#ffe98ecc,transparent 58%),linear-gradient(140deg,#72532a,#2d2940 58%,#080d17)}
.booster.alt{border-color:#ed9dff;box-shadow:0 0 26px #db80ff,0 0 7px #fff,0 9px 18px #0009}.booster.alt .art{background:radial-gradient(ellipse at 50% 43%,#f0a9ffdd,transparent 60%),linear-gradient(140deg,#583b77,#202345 58%,#080d17)}
.booster.selected{transform:translateY(-9px) scale(1.04)!important;filter:brightness(1.25)}.booster.opened{opacity:.24;filter:grayscale(.8);transform:scale(.93)!important;cursor:default}.booster.opened:after{content:"✓";font-size:45px;top:37%;color:#fff}.booster.opened .pack-name{color:#91a0b6}
.actions{position:relative;z-index:2;display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:36px auto 0}.btn{min-width:145px;padding:13px 22px;border:1px solid #66758b;background:linear-gradient(#25344b,#121d2e);font-weight:900;font-size:12px;letter-spacing:2px;box-shadow:0 5px 16px #0008}.btn.primary{color:#191711;border:1px solid #fff0b0;background:linear-gradient(110deg,#c59c42,#ffe99b 48%,#d4a34c);box-shadow:0 0 24px #eac65a55}.btn:hover{filter:brightness(1.2)}.btn:disabled{opacity:.35;cursor:not-allowed}
.hint{text-align:center;color:#a6b2c4;font-size:10px;margin-top:13px;position:relative;z-index:2}
#reveal{display:none;max-width:1000px;margin:24px auto 0;padding:20px;border:1px solid #53637a;background:#0c1422eF;box-shadow:0 15px 40px #0008}#reveal.show{display:block;animation:fade .35s}@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.reveal-head{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:16px}.reveal-head h3{margin:0;font-size:15px;letter-spacing:2px}.reveal-head span{font-size:11px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.card{perspective:900px;min-width:0;cursor:pointer}.inner{position:relative;aspect-ratio:2/2.9;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.75,.2,1)}.card.flip .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;border:1px solid #697b92;background:#16243a}.back{display:grid;place-items:center;background:repeating-linear-gradient(135deg,#172b45 0 7px,#263d5c 7px 14px)}.back:after{content:"ACG";font-size:clamp(15px,2vw,24px);font-weight:1000;letter-spacing:3px;color:#d9c17c;text-shadow:0 0 12px #e5c65e}.front{transform:rotateY(180deg)}.front img{width:100%;height:100%;object-fit:cover;display:block}.front strong{position:absolute;bottom:0;left:0;right:0;text-align:center;padding:22px 4px 6px;background:linear-gradient(transparent,#050912);font-size:clamp(9px,1vw,12px)}.card.r5 .front{border:2px solid #ffdb72;box-shadow:0 0 16px #ffd65b}.card.r4 .front{border:2px solid #9ec8ff;box-shadow:0 0 13px #8bbaff}.card.alt .front{border:2px solid #e9a0ff;box-shadow:0 0 20px #e69aff}
.card-name{text-align:center;font-size:10px;color:#aab6c8;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card:not(.flip) .card-name{color:#5f6e84}
.summary{text-align:center;font-size:12px;color:#aab8ca;margin-top:16px}.summary b{color:#f3d77e}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:11px 18px;background:#17253a;border:1px solid #d0b46d;color:#ffe9ac;font-size:12px;z-index:9;opacity:0;transition:.2s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:700px){main{padding:22px 10px 45px}.stage{padding:18px 10px}.packs{gap:9px 7px;margin-top:20px}.booster{max-height:none}.booster:nth-child(n+6){transform:translateY(12px)}.actions{margin-top:30px}.btn{min-width:125px;padding:11px 12px}.cards{gap:7px}#reveal{padding:13px}.reveal-head{align-items:flex-start;flex-direction:column}}
@media(max-width:430px){.packs{gap:8px 5px}.booster:before{inset:3px}.booster .pack-name{font-size:7px;letter-spacing:1px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.tag{font-size:8px}.hero p{font-size:10px}}
</style></head>
<body>
<header class="top"><div class="brand">ACG <b>PACK LAB</b></div><div class="tag">MD STYLE · 纯模拟，不消耗代币</div></header>
<main>
<div class="eyebrow">CARD PACK COLLECTION</div><section class="hero"><h1>十连开包</h1><p>十个卡包同时登场 · 稀有度光效预告 · 逐包开启 50 张卡牌</p></section>
<div class="selector" id="selector"><button class="active" data-pack="pack_001">无限泡影</button><button data-pack="pack_002">梦幻</button><button data-pack="pack_003">固拉多</button><button data-pack="pack_004">盖欧卡</button></div>
<section class="stage">
<div class="stage-head"><h2 id="stage-title">TEN PACK OPENING</h2><p id="stage-sub">十个卡包已准备就绪，点击 OPEN 开启</p></div>
<div class="packs" id="packs"></div>
<div class="actions"><button class="btn primary" id="open">OPEN · 开启卡包</button><button class="btn" id="skip">SKIP · 全部揭晓</button><button class="btn" id="reset">重新模拟十连</button></div>
<div class="hint" id="hint">边框颜色代表该包中最高稀有度；结果在演示开始时生成，特效与结果一致。</div>
</section>
<section id="reveal"><div class="reveal-head"><h3 id="reveal-title">第 1 包 · 卡牌揭晓</h3><span id="reveal-progress">0 / 5 已揭晓</span></div><div class="cards" id="cards"></div><div class="summary" id="summary">点击卡牌翻开</div><div class="actions"><button class="btn primary" id="next">翻开下一张</button><button class="btn" id="all">翻开本包全部卡牌</button></div></section>
</main><div class="toast" id="toast"></div>
<script>
const PACKS={pack_001:{name:"无限泡影",alt:0},pack_002:{name:"梦幻",alt:.1},pack_003:{name:"固拉多",alt:.1},pack_004:{name:"盖欧卡",alt:.1}};
let allCards=[],selected="pack_001",bundles=[],current=0,revealed=0,started=false;
const $=id=>document.getElementById(id);
function isAlt(c){return /异画/.test(c.name)||/\\(异画\\)/.test(c.name)}
function star(c){return Number(c.star)||3}
function grade(c){return isAlt(c)?'alt':star(c)>=5?'r5':star(c)>=4?'r4':'r3'}
function toast(s){$("toast").textContent=s;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),2000)}
function pick(pool){const x=Math.random()*100,a=PACKS[selected].alt;let target=x<a?'alt':x<a+1.2?'r5':x<a+6.2?'r4':'r3';let list=pool.filter(c=>grade(c)===target);if(!list.length)list=pool.filter(c=>target==='alt'?isAlt(c):!isAlt(c)&&star(c)===(target==='r5'?5:target==='r4'?4:3));if(!list.length)list=pool;return list[Math.floor(Math.random()*list.length)]}
function makeBundles(){const pool=allCards.filter(c=>c.pack_id===selected);if(!pool.length){toast("当前卡包没有可用卡牌");return}bundles=Array.from({length:10},()=>Array.from({length:5},()=>pick(pool)));current=0;revealed=0;started=false;$("reveal").classList.remove("show");renderPacks();$("stage-title").textContent="TEN PACK OPENING";$("stage-sub").textContent="十个卡包已准备就绪，点击 OPEN 开启";$("open").disabled=false;$("skip").disabled=false}
function renderPacks(){$("packs").replaceChildren();bundles.forEach((pack,i)=>{const highest=pack.reduce((v,c)=>{const g=grade(c);return g==='alt'?4:g==='r5'?3:g==='r4'?2:Math.max(v,1)},0);const el=document.createElement("div");el.className="booster"+(highest===4?" alt":highest===3?" r5":highest===2?" r4":"");el.style.setProperty("--i",i);el.innerHTML='<div class="art"></div><div class="pack-name">'+PACKS[selected].name.toUpperCase()+' · PACK '+String(i+1).padStart(2,'0')+'</div>';el.addEventListener("click",()=>{if(!started){startOpening()}if(i===current)openCurrent();else if(i<current)toast("这一包已经开启");else toast("请按顺序开启卡包")});$("packs").appendChild(el)})}
function startOpening(){started=true;$("stage-sub").textContent="召唤结果已生成 · 按顺序开启十个卡包";$("open").textContent="OPEN · 开启第 1 包"}
function openCurrent(){if(current>=10){finish();return}const pack=bundles[current];revealed=0;$("reveal").classList.add("show");$("reveal-title").textContent="第 "+(current+1)+" 包 · 卡牌揭晓";$("reveal-progress").textContent="0 / 5 已揭晓";$("cards").replaceChildren();pack.forEach((c,i)=>{const el=document.createElement("div");el.className="card "+(grade(c)==='alt'?'alt':grade(c));el.innerHTML='<div class="inner"><div class="face back"></div><div class="face front"><img loading="lazy" src="'+c.image+'" alt=""><strong>'+c.name+'</strong></div></div><div class="card-name">未揭晓</div>';el.addEventListener("click",()=>flipCard(i));$("cards").appendChild(el)});$("reveal").scrollIntoView({behavior:"smooth",block:"center"});$("open").textContent=current===9?"OPEN · 完成十连":"OPEN · 开启下一包";$("stage-sub").textContent="正在开启第 "+(current+1)+" / 10 包"}
function flipCard(i){const el=$("cards").children[i];if(!el||el.classList.contains("flip"))return;el.classList.add("flip");el.querySelector(".card-name").textContent=bundles[current][i].name;revealed++;updateReveal();const c=bundles[current][i];if(isAlt(c))toast("✦ 异画卡降临！");else if(star(c)>=5)toast("★★★★★ 五星卡牌！")}
function updateReveal(){const pack=bundles[current];$("reveal-progress").textContent=revealed+" / 5 已揭晓";const n=pack.filter(c=>grade(c)==='alt').length,s5=pack.filter(c=>grade(c)==='r5').length,s4=pack.filter(c=>grade(c)==='r4').length;$("summary").innerHTML="异画 <b>"+n+"</b>　五星 <b>"+s5+"</b>　四星 <b>"+s4+"</b>　三星 <b>"+(5-n-s5-s4)+"</b>";}
function flipAll(){[...$("cards").children].forEach((el,i)=>setTimeout(()=>flipCard(i),i*110))}
function nextPack(){if(!started)startOpening();if(current>=10){finish();return}if(current>0&&revealed<5){toast("请先揭晓当前卡包，或使用 SKIP");return}if(current===0&&$("reveal").classList.contains("show")&&revealed<5){toast("请先揭晓当前卡包，或使用 SKIP");return}if(current>0||$("reveal").classList.contains("show")){$("packs").children[current].classList.add("opened");current++}if(current>=10){finish();return}openCurrent()}
function finish(){bundles.forEach((_,i)=>$("packs").children[i].classList.add("opened"));$("open").disabled=true;$("skip").disabled=true;$("stage-sub").textContent="十连完成 · 共 50 张卡牌";$("reveal").classList.add("show");$("reveal-title").textContent="十连召唤完成";$("cards").replaceChildren();const flat=bundles.flat();flat.forEach((c,i)=>{const el=document.createElement("div");el.className="card "+(grade(c)==='alt'?'alt':grade(c));el.innerHTML='<div class="inner"><div class="face back"></div><div class="face front"><img loading="lazy" src="'+c.image+'" alt=""><strong>'+c.name+'</strong></div></div><div class="card-name">'+c.name+'</div>';el.classList.add("flip");$("cards").appendChild(el)});const count={alt:0,r5:0,r4:0,r3:0};flat.forEach(c=>count[grade(c)]++);$("reveal-progress").textContent="50 / 50 已揭晓";$("summary").innerHTML="十连结果：异画 <b>"+count.alt+"</b>　五星 <b>"+count.r5+"</b>　四星 <b>"+count.r4+"</b>　三星 <b>"+count.r3+"</b>";$("reveal").scrollIntoView({behavior:"smooth",block:"start"})}
function skipAll(){if(!bundles.length)return;started=true;finish()}
$("selector").addEventListener("click",e=>{const b=e.target.closest("button[data-pack]");if(!b)return;selected=b.dataset.pack;document.querySelectorAll("#selector button").forEach(x=>x.classList.toggle("active",x===b));makeBundles()});
$("open").addEventListener("click",()=>{if(!started){startOpening();openCurrent();return}if(current===0&&!$("reveal").classList.contains("show")){openCurrent();return}if(revealed<5){toast("先揭晓当前这包的 5 张卡");return}nextPack()});
$("skip").addEventListener("click",skipAll);$("reset").addEventListener("click",makeBundles);$("next").addEventListener("click",()=>{const i=[...$("cards").children].findIndex(x=>!x.classList.contains("flip"));if(i>=0)flipCard(i)});$("all").addEventListener("click",flipAll);
fetch("./data/cards.json").then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{allCards=d;makeBundles()}).catch(()=>toast("卡牌数据加载失败，请从网站根目录打开"));
</script></body></html>

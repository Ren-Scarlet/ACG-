<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>重置密码 - ACG</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;padding:32px 16px;background:#10131b;color:#eef1f7;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,480px);margin:8vh auto;padding:28px;background:#1a2030;border:1px solid #30394e;border-radius:16px}
    h1{margin:0 0 10px;font-size:24px}
    p{color:#b8c1d3;line-height:1.65}
    label{display:block;margin:16px 0 7px}
    input{width:100%;padding:12px;border:1px solid #46516a;border-radius:8px;background:#101623;color:#fff;font:inherit}
    button{margin-top:20px;padding:12px 18px;border:0;border-radius:8px;background:#6b8cff;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    button:disabled{opacity:.55;cursor:not-allowed}
    .status{margin-top:16px;padding:12px;border-radius:8px;background:#252e40;white-space:pre-wrap}
    .error{color:#ffb5b5}.success{color:#a8f0c2}
    a{color:#9db4ff}
    [hidden]{display:none!important}
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main>
    <h1>设置新密码</h1>
    <p>请设置一个至少 8 位的新密码。修改密码不会影响原账号中的卡牌、代币、积分或其他数据。</p>
    <div id="loading">正在验证重置链接……</div>
    <form id="reset-form" hidden>
      <label for="new-password">新密码</label>
      <input id="new-password" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirm-password">确认新密码</label>
      <input id="confirm-password" type="password" minlength="8" autocomplete="new-password" required>
      <button type="submit">确认修改密码</button>
    </form>
    <div id="status" class="status" role="status" aria-live="polite" hidden></div>
    <p><a href="./index.html">返回 ACG 网站</a></p>
  </main>
  <script>
  (async () => {
    const SUPABASE_URL = "https://lbyobelugnlrkwwmnske.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_tC_VrNT8t2KkWyfIhVJUkA_kwzygUoK";
    const loading = document.getElementById("loading");
    const form = document.getElementById("reset-form");
    const status = document.getElementById("status");
    const show = (message, kind) => {
      status.textContent = message;
      status.className = "status " + (kind || "");
      status.hidden = false;
    };
    try {
      let sdk = window.supabase;
      if (!sdk?.createClient) {
        await new Promise((resolve, reject) => {
          const timer = setTimeout(() => reject(new Error("账号服务组件加载超时，请刷新页面重试。")), 12000);
          const check = () => {
            if (window.supabase?.createClient) { clearTimeout(timer); resolve(); }
          };
          const script = document.querySelector('script[src*="supabase-js"]');
          script?.addEventListener("load", check, { once: true });
          script?.addEventListener("error", () => { clearTimeout(timer); reject(new Error("无法加载账号服务组件。")); }, { once: true });
          check();
        });
        sdk = window.supabase;
      }
      const client = sdk.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
      });
      const { data, error } = await client.auth.getSession();
      if (error) throw error;
      if (!data.session) {
        throw new Error("重置链接无效、已过期或已使用。请返回登录页面重新发送重置邮件。");
      }
      loading.hidden = true;
      form.hidden = false;
      form.addEventListener("submit", async event => {
        event.preventDefault();
        const password = document.getElementById("new-password").value;
        const confirm = document.getElementById("confirm-password").value;
        const button = form.querySelector("button");
        if (password.length < 8) return show("密码至少需要 8 位。", "error");
        if (password !== confirm) return show("两次输入的密码不一致。", "error");
        button.disabled = true;
        show("正在更新密码……", "");
        try {
          const { error: updateError } = await client.auth.updateUser({ password });
          if (updateError) throw updateError;
          form.hidden = true;
          show("密码修改成功！现在可以返回网站，使用新密码登录原账号。", "success");
          await client.auth.signOut();
        } catch (err) {
          show("密码修改失败：" + (err?.message || String(err)), "error");
        } finally {
          button.disabled = false;
        }
      });
    } catch (err) {
      loading.hidden = true;
      show(err?.message || String(err), "error");
    }
  })();
  </script>
</body>
</html>
